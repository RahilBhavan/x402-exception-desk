[project]
name = "settlement-exception-desk"
version = "0.1.0"
description = "Synthetic x402 settlement-to-delivery exception desk"
requires-python = ">=3.9"

[project.scripts]
exception-desk = "exception_desk.cli:main"

[tool.unittest]
start-directory = "tests"


[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
