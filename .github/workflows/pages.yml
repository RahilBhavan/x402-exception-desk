name: Publish operator report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Stage site
        run: |
          mkdir -p _site
          cp artifacts/generated/operator-report.html _site/index.html
          cp artifacts/generated/operator-report.css artifacts/generated/operator-report.js _site/
          cp docs/social-card.png artifacts/operations-memo.pdf _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
